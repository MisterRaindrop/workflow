name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          bash -n wk
          bash -n test.sh
          bash -n install.sh
          bash -n config.env.example
          for f in test/fake-lxc test/bin/*; do bash -n "$f"; done

      - name: Install shellcheck
        run: |
          if [[ "$(uname)" == "Darwin" ]]; then
            brew install shellcheck
          else
            sudo apt-get update && sudo apt-get install -y shellcheck
          fi

      - name: Shellcheck (errors are fatal)
        run: shellcheck -S error -x wk test.sh install.sh test/fake-lxc test/bin/*

      - name: Shellcheck (warnings, advisory)
        run: shellcheck -x wk test.sh install.sh test/fake-lxc test/bin/* || true

      - name: Unit tests
        run: bash test.sh

      - name: Help renders
        run: ./wk help
